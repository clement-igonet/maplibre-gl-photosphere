name: Release

# Releases are driven the maplibre-gl-js way, through MapLibre's reusable
# workflows: bump the version in package.json on main (see
# create-bump-version-pr.yml) and this workflow detects the change, runs the
# tests, publishes to npm (trusted publishing / OIDC — no tokens), creates the
# vX.Y.Z tag, attests provenance and creates the GitHub Release from the
# matching "## X.Y.Z" section of CHANGELOG.md. Never push tags manually.
permissions:
  id-token: write # Required for trusted publishing
  contents: write
  attestations: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    uses: maplibre/reusable-workflows/.github/workflows/npm-publish.yml@main
    with:
      # No build step (src/ ships as-is): the "build" is the test gate plus
      # assembling dist/ for the release archive + provenance attestation.
      build-command: npm ci --no-audit --no-fund && npx vitest run && rm -rf dist && mkdir dist && cp -r src README.md CHANGELOG.md LICENSE dist/
      # The demo is static (docs/, served by GitHub Pages from main): nothing
      # to build; the reusable workflow mirrors it to the gh-pages branch.
      docs-command: 'true'
      docs-output-dir: docs
